name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intake
          POSTGRES_PASSWORD: intake
          POSTGRES_DB: intake
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intake -d intake"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (in-memory SQLite)
        if: matrix.db == 'sqlite'
        run: python -m pytest -q
      - name: pytest (real PostgreSQL)
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://intake:intake@127.0.0.1:5432/intake
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - name: build
        run: npm run build
        env:
          CI: "false" # react-scripts treats warnings as errors when CI=true

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (production dependencies)
        working-directory: frontend
        # react-scripts 5 pulls in build-time packages with known "high" advisories
        # (they are not shipped in the static bundle), so only critical findings fail.
        run: npm audit --omit=dev --audit-level=critical
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Compose file validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  images:
    name: Build and scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          - name: mock-ti-gateway
            context: mock-ti-services/mock-ti-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t intake-${{ matrix.name }}:ci ${{ matrix.context }}
      - name: Trivy scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: intake-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
