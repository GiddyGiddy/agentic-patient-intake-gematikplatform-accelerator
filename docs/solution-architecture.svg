<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>
  <text x="640" y="32" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">Agentic Patient Intake – On-Premise Solution Architecture</text>

  <!-- on-premise boundary -->
  <rect x="150" y="60" width="780" height="650" rx="12" fill="#f8fafc" stroke="#1f2937" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="168" y="84" font-weight="700" fill="#1f2937">ON-PREMISE – Klinik / Praxis Rechenzentrum (Podman host) – sensitive health data never leaves this boundary</text>

  <!-- patient -->
  <g>
    <circle cx="70" cy="300" r="16" fill="#0078d4"/>
    <path d="M40,350 q30,-45 60,0 z" fill="#0078d4"/>
    <text x="70" y="378" text-anchor="middle" font-weight="600">Patient</text>
    <text x="70" y="394" text-anchor="middle" fill="#6b7280">Browser</text>
  </g>

  <!-- frontend -->
  <rect x="180" y="250" width="170" height="120" rx="8" fill="#fff" stroke="#374151"/>
  <rect x="198" y="268" width="36" height="26" rx="3" fill="#e0f2fe" stroke="#0369a1"/>
  <rect x="198" y="268" width="36" height="7" fill="#0369a1"/>
  <text x="265" y="285" font-weight="600">Frontend</text>
  <text x="198" y="318" fill="#374151">React SPA + nginx</text>
  <text x="198" y="336" fill="#374151">OIDC PKCE login</text>
  <text x="198" y="354" fill="#374151">Chat, consent dialog</text>

  <!-- backend group -->
  <rect x="400" y="110" width="500" height="320" rx="8" fill="#fff" stroke="#374151"/>
  <rect x="416" y="124" width="30" height="26" rx="4" fill="#ecfdf5" stroke="#047857"/>
  <path d="M424,132 h14 M424,137 h14 M424,142 h14" stroke="#047857" stroke-width="2"/>
  <text x="456" y="143" font-weight="700">Backend – FastAPI + LangGraph (container)</text>
  <text x="416" y="164" fill="#6b7280">Multi-agent AI workflow · Gesundheits-ID token validation · server-side consent</text>

  <rect x="416" y="174" width="468" height="26" rx="13" fill="#1f2937"/>
  <text x="650" y="192" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">LangGraph Orchestrator · shared state · route_next_step()</text>
  <g stroke="#6b7280" stroke-dasharray="3 3"><path d="M472,200 V214"/><path d="M592,200 V214"/><path d="M712,200 V214"/><path d="M832,200 V214"/></g>

  <rect x="420" y="214" width="104" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="434" cy="228" r="9" fill="#4f46e5"/><text x="434" y="232" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1</text>
  <rect x="496" y="220" width="18" height="13" rx="3" fill="#4f46e5"/><circle cx="501" cy="226" r="1.8" fill="#fff"/><circle cx="509" cy="226" r="1.8" fill="#fff"/>
  <text x="472" y="250" text-anchor="middle" font-weight="700" font-size="12">Intake Agent</text>
  <text x="472" y="266" text-anchor="middle" fill="#6b7280" font-size="10.5">Anamnese, Triage</text>

  <rect x="540" y="214" width="104" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="554" cy="228" r="9" fill="#b45309"/><text x="554" y="232" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2</text>
  <rect x="616" y="220" width="18" height="13" rx="3" fill="#b45309"/><circle cx="621" cy="226" r="1.8" fill="#fff"/><circle cx="629" cy="226" r="1.8" fill="#fff"/>
  <text x="592" y="250" text-anchor="middle" font-weight="700" font-size="12">Consent Agent</text>
  <text x="592" y="266" text-anchor="middle" fill="#6b7280" font-size="10.5">ePA-Einwilligung</text>

  <rect x="660" y="214" width="104" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="674" cy="228" r="9" fill="#4f46e5"/><text x="674" y="232" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">3</text>
  <rect x="736" y="220" width="18" height="13" rx="3" fill="#4f46e5"/><circle cx="741" cy="226" r="1.8" fill="#fff"/><circle cx="749" cy="226" r="1.8" fill="#fff"/>
  <text x="712" y="250" text-anchor="middle" font-weight="700" font-size="11.5">Scheduling Agent</text>
  <text x="712" y="266" text-anchor="middle" fill="#6b7280" font-size="10.5">FHIR Appointment</text>

  <rect x="780" y="214" width="104" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="794" cy="228" r="9" fill="#4f46e5"/><text x="794" y="232" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">4</text>
  <rect x="856" y="220" width="18" height="13" rx="3" fill="#4f46e5"/><circle cx="861" cy="226" r="1.8" fill="#fff"/><circle cx="869" cy="226" r="1.8" fill="#fff"/>
  <text x="832" y="250" text-anchor="middle" font-weight="700" font-size="12">KIM Agent</text>
  <text x="832" y="266" text-anchor="middle" fill="#6b7280" font-size="10.5">Arztbrief, KIM</text>

  <path d="M524,246 H540 M644,246 H660 M764,246 H780" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M884,246 H894 V292 H410 V246" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="416" y="306" fill="#b45309" font-size="10.5" font-weight="600">Consent missing → iam_required: run stops, patient confirms via Gesundheits-ID, /api/consent resumes at step 2</text>
  <text x="416" y="322" fill="#b91c1c" font-size="10.5" font-weight="600">Scheduling failure (gateway timeout/error) → ErrorHandler: alert audit, fallback message, END</text>
  <rect x="722" y="268" width="38" height="14" rx="7" fill="#b91c1c"/><text x="741" y="278" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">ERR</text>
  <path d="M741,282 V292" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 2"/>

  <rect x="420" y="332" width="464" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="432" y="349" font-weight="600" font-size="12">Supporting services</text>
  <text x="432" y="366" fill="#374151" font-size="11.5">epa_client (FHIR MedicationStatement, patient token) · kim_outbox (retry)</text>
  <text x="432" y="383" fill="#374151" font-size="11.5">audit (JSON + DB, pseudonymised) · session store · rate limit</text>
  <text x="432" y="400" fill="#374151" font-size="11.5">housekeeping worker: KIM retry, purge idle sessions</text>

  <!-- postgres -->
  <g>
    <rect x="430" y="480" width="200" height="130" rx="8" fill="#fff" stroke="#374151"/>
    <ellipse cx="462" cy="512" rx="18" ry="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <path d="M444,512 v22 a18,6 0 0 0 36,0 v-22" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="492" y="520" font-weight="700">PostgreSQL 16</text>
    <text x="446" y="556" fill="#374151">intake_session · consent</text>
    <text x="446" y="574" fill="#374151">audit_event · kim_outbox</text>
    <text x="446" y="592" fill="#6b7280">only persistent store (pg-data)</text>
  </g>

  <!-- LLM -->
  <g>
    <rect x="690" y="480" width="210" height="130" rx="8" fill="#fff" stroke="#374151"/>
    <circle cx="722" cy="512" r="14" fill="#f3e8ff" stroke="#7e22ce"/>
    <path d="M714,512 h16 M722,504 v16" stroke="#7e22ce" stroke-width="2"/>
    <text x="748" y="518" font-weight="700">Local LLM (Ollama)</text>
    <text x="706" y="556" fill="#374151">Follow-up questions, summary,</text>
    <text x="706" y="574" fill="#374151">triage, Arztbrief text</text>
    <text x="706" y="592" fill="#6b7280">rule-based fallback if offline</text>
  </g>

  <!-- ops -->
  <rect x="180" y="480" width="210" height="130" rx="8" fill="#fff" stroke="#374151" stroke-dasharray="4 3"/>
  <rect x="196" y="496" width="30" height="22" rx="3" fill="#e5e7eb" stroke="#374151"/><rect x="196" y="522" width="30" height="22" rx="3" fill="#e5e7eb" stroke="#374151"/>
  <text x="236" y="518" font-weight="700">Podman host</text>
  <text x="196" y="566" fill="#374151">podman compose, named volumes</text>
  <text x="196" y="584" fill="#374151">health checks, restart policy</text>

  <!-- TI zone -->
  <rect x="990" y="60" width="270" height="650" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1125" y="84" text-anchor="middle" font-weight="700" fill="#0f766e">Telematikinfrastruktur (TI)</text>

  <g>
    <rect x="1010" y="104" width="230" height="110" rx="8" fill="#fff" stroke="#0f766e"/>
    <path d="M1030,126 l16,-8 l16,8 v14 q0,14 -16,22 q-16,-8 -16,-22 z" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="1074" y="138" font-weight="700">TI-Gateway / Konnektor</text>
    <text x="1026" y="168" fill="#374151">HSM-B / SMC-B signature</text>
    <text x="1026" y="186" fill="#374151">X-TI-Telematik-ID, TLS into TI</text>
    <text x="1026" y="204" fill="#6b7280">dev: mock-ti-gateway :8082</text>
  </g>
  <g>
    <rect x="1010" y="240" width="230" height="100" rx="8" fill="#fff" stroke="#0f766e"/>
    <rect x="1030" y="258" width="26" height="30" rx="3" fill="#fef9c3" stroke="#a16207"/><circle cx="1043" cy="269" r="4" fill="#a16207"/>
    <text x="1068" y="276" font-weight="700">Gesundheits-ID (IdP)</text>
    <text x="1026" y="306" fill="#374151">OpenID Connect / OAuth2</text>
    <text x="1026" y="324" fill="#6b7280">dev: mock-id-dienst :8081</text>
  </g>
  <g>
    <rect x="1010" y="366" width="230" height="110" rx="8" fill="#fff" stroke="#0f766e"/>
    <ellipse cx="1043" cy="392" rx="14" ry="5" fill="#ffe4e6" stroke="#be123c"/><path d="M1029,392 v16 a14,5 0 0 0 28,0 v-16" fill="#ffe4e6" stroke="#be123c"/>
    <text x="1068" y="400" font-weight="700">ePA + KIS (FHIR / ISiK)</text>
    <text x="1026" y="430" fill="#374151">MedicationStatement, Slot,</text>
    <text x="1026" y="448" fill="#374151">Appointment, Patient</text>
    <text x="1026" y="466" fill="#6b7280">dev: HAPI FHIR :8080</text>
  </g>
  <g>
    <rect x="1010" y="502" width="230" height="110" rx="8" fill="#fff" stroke="#0f766e"/>
    <rect x="1028" y="520" width="30" height="22" rx="2" fill="#e0f2fe" stroke="#0369a1"/><path d="M1028,520 l15,12 l15,-12" fill="none" stroke="#0369a1"/>
    <text x="1068" y="538" font-weight="700">KIM-Clientmodul</text>
    <text x="1026" y="566" fill="#374151">SMTP, encrypts + signs</text>
    <text x="1026" y="584" fill="#374151">Arztbrief + triage.json</text>
    <text x="1026" y="602" fill="#6b7280">dev: mock-kim-cm :2525</text>
  </g>
  <g>
    <circle cx="1060" cy="662" r="12" fill="#0078d4"/><path d="M1040,692 q20,-30 40,0 z" fill="#0078d4"/>
    <text x="1096" y="670" font-weight="600">Hausarzt / Facharzt</text>
    <text x="1096" y="688" fill="#6b7280">KIM mailbox</text>
  </g>

  <!-- arrows -->
  <path d="M100,310 H180" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="104" y="302" fill="#6b7280" font-size="11">HTTPS</text>
  <path d="M350,310 H400" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="352" y="302" fill="#6b7280" font-size="11">REST+JWT</text>
  <path d="M265,250 V100 H970 V290 H1010" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="275" y="96" fill="#0f766e" font-size="11">OIDC login (PKCE) + JWKS validation by backend</text>
  <path d="M900,160 H990" stroke="#0f766e" stroke-width="2" marker-end="url(#g)"/>
  <text x="920" y="152" fill="#0f766e" font-size="11">FHIR + token</text>
  
  
  <path d="M900,380 H950 V560 H990" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#g)"/>
  <text x="935" y="500" fill="#0f766e" font-size="11" transform="rotate(-90 935 500)">SMTP</text>
  <path d="M1240,160 H1250 V420 H1240" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#g)"/>
  <path d="M1125,612 V640" stroke="#0f766e" stroke-width="2" marker-end="url(#g)"/>
  <path d="M530,430 V480" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M780,430 V480" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="540" y="458" fill="#6b7280" font-size="11">SQL</text>
  <text x="790" y="458" fill="#6b7280" font-size="11">HTTP (local)</text>

  <!-- optional Azure -->
  <rect x="150" y="730" width="780" height="56" rx="8" fill="#eff6ff" stroke="#0078d4" stroke-dasharray="6 4"/>
  <path d="M172,758 l14,-18 l14,18 z" fill="#0078d4"/>
  <text x="212" y="752" font-weight="700" fill="#0078d4">Optional hybrid management (not required, no patient data): Azure Arc · Azure Monitor · Container Registry for images</text>
  <text x="212" y="772" fill="#6b7280">Only operational metadata may leave the premises. Backend, database and LLM stay on-premise.</text>

  <!-- legend -->
  <text x="990" y="740" fill="#6b7280" font-size="11">Solid: runtime call · dashed: login redirect</text>
  <text x="990" y="758" fill="#6b7280" font-size="11">Green: TI zone (dev = mock services)</text>
</svg>



