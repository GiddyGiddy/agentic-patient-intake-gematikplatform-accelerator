services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      REACT_APP_API_URL: http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: agentic_backend
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - FHIR_BASE_URL=http://mock-fhir-server:8080/fhir
      - KIM_CM_HOST=mock-kim-cm
      - KIM_CM_PORT=25
    depends_on:
      - mock-kim-cm
    networks:
      - ti-network

  llm:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  mock-id-dienst:
    build: ./mock-ti-services/mock-id-dienst
    ports:
      - "8081:8081"

  mock-kis-fhir:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"

 # NEU: Das simulierte KIM-Clientmodul
  mock-kim-cm:
    build: ./mock-ti-services/mock-kim-cm
    container_name: mock_kim_client_module
    ports:
      - "1025:25" # Mappt den internen Port 25 auf Port 1025 des Host-Rechners (zum Debuggen)
    networks:
      - ti-network

volumes:
  ollama-data:
networks:
  ti-network:
